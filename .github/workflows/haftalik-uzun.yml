name: Haftalık uzun video (derleme)

# Haftanın Shorts bölümleri yatay (16:9) olarak paralel işlerde ayrı ayrı çizilir, her biri kendi
# kalite kontrolünden geçer, sonra tek uzun videoda birleştirilir.
# Uzun video gizliliği UZUN_GIZLILIK değişkeninden gelir (varsayılan private).
# Pazar zamanlaması + herkese açık: kullanıcı onayı 2026-10-30 ("iki kanalda da Shorts ve uzun video").
on:
  schedule:
    - cron: "7 7 * * 0"    # pazar 10:07 TR
    - cron: "7 15 * * 0"   # yedek: ilki atlanırsa (derlenen Shorts tekrar seçilmez)
    - cron: "7 7 * * 3"    # çarşamba 10:07 TR: karışık ~15 dk "Uyku Öncesi Masallar" (onay 2026-11-06)
    - cron: "7 15 * * 3"   # yedek (bu hafta karışık yüklendiyse tekrar yapılmaz)
  workflow_dispatch:
    inputs:
      tur:
        description: "haftalik = haftanın yeni bölümleri; karisik = yayınlanmış bölümlerden ~15 dk"
        default: "haftalik"
      bolumler:
        description: "Bölüm numaraları, virgülle (ör. 1,2,3,4,5,6). Boş = yüklenmiş ama derlenmemiş Shorts'lar"
        required: false
      yayin:
        description: "otomatik = depo ayarına uy; hayir = yalnız üret ve denetle (deneme)"
        default: "otomatik"

permissions:
  contents: write

concurrency:
  group: haftalik-uzun
  cancel-in-progress: false

jobs:
  sec:
    runs-on: ubuntu-latest
    outputs:
      bolumler: ${{ steps.s.outputs.bolumler }}
      matris: ${{ steps.s.outputs.matris }}
      adet: ${{ steps.s.outputs.adet }}
      tur: ${{ steps.s.outputs.tur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - id: s
        run: |
          TUR="${{ inputs.tur }}"
          if [ -z "$TUR" ]; then
            if [ "$(date -u +%u)" = "3" ]; then TUR=karisik; else TUR=haftalik; fi
          fi
          echo "tur=$TUR" >> "$GITHUB_OUTPUT"
          python derleme.py sec --tur "$TUR" --bolumler "${{ inputs.bolumler }}"

  # 2026-11-12: 24 fps + 1080p, her bölüm 8 makinede parçalı çizilir (ciz.yml); pazar çizilen bölüm
  # çarşamba karışık derlemesinde önbellekten gelir, yeniden çizilmez
  uret:
    needs: sec
    if: needs.sec.outputs.adet != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sec.outputs.matris) }}
    uses: ./.github/workflows/ciz.yml
    with:
      bolum: ${{ matrix.bolum }}
      profil: uzun
      ad: ${{ matrix.ad }}
      prototip: true

  birlestir:
    needs: [sec, uret]
    if: always() && needs.sec.outputs.adet != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt -r requirements-3d.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: parcalar
      - name: Birleştir ve denetle
        run: python derleme.py birlestir parcalar --tur "${{ needs.sec.outputs.tur || 'haftalik' }}"
      - name: (İzinliyse) yükle
        env:
          YAYIN: ${{ inputs.yayin == 'hayir' && 'kapali' || vars.YAYIN || 'kapali' }}
          YT_GIZLILIK: ${{ vars.UZUN_GIZLILIK || 'private' }}
          YT_HERKESE_ACIK_ONAY: ${{ vars.YT_HERKESE_ACIK_ONAY || 'hayir' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python derleme.py yukle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derleme-${{ github.run_id }}
          path: |
            cikti3d/derleme/*.mp4
            cikti3d/derleme/*.jpg
            cikti3d/derleme/*.rapor.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Yayın kaydını depoya yaz
        if: always()
        run: |
          git config user.name "cocuk-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          cp yayin_kaydi.json "$RUNNER_TEMP/kayit.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/kayit.json"
          cp seri/findik-ile-pamuk/karakter_izleri.json "$RUNNER_TEMP/izler.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python kayit_birlestir.py "$RUNNER_TEMP/kayit.json" "$RUNNER_TEMP/izler.json"
            git add yayin_kaydi.json seri/findik-ile-pamuk/karakter_izleri.json
            git diff --cached --quiet && exit 0
            git commit -q -m "yayın kaydı (derleme): $(date -u +%F)" && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
