name: Günlük 3D bölüm (Fındık ile Pamuk)

# 2026-11-13: günde 2 Shorts — masal (17:00) + İngilizce dersi (12:00, e*.json). Her çalıştırma en yakın
# boş saati olan hattan 1 bölüm üretir; günde 6 deneme 2 saati rahat doldurur.

on:
  # Herkese açık günlük yayın kullanıcı onayıyla açıldı (2026-10-30), kanal: Minik Masal Evi.
  # 2026-10-30: takvim 1 hafta önceden dolar (haftalık onay); her çalıştırma en çok 2 boş saati doldurur.
  # GitHub zamanlanmış işleri yoğunlukta geciktirir/atlar (2026-10-30: 05:00 işi hiç başlamadı): 4 saatte
  # bir, saat başı olmayan dakikada denenir; takvim doluysa iş Blender kurmadan 1 dakikada biter.
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      bolum:
        description: "Belirli bölüm (boş = sıradaki), ör. seri/findik-ile-pamuk/bolumler/b002.json"
        required: false
      hat:
        description: "boş = en yakın boş saat; masal_shorts / ingilizce_shorts"
        required: false
      profil:
        description: "shorts / uzun"
        default: "shorts"
      yayin:
        description: "otomatik = depo ayarına uy; hayir = yalnız üret ve denetle (deneme)"
        default: "otomatik"

permissions:
  contents: write

concurrency:
  group: gunluk3d
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.YAYIN }}" = "acik" ]; then
            n=$(python3 -m otonom.takvim masal_shorts,ingilizce_shorts yayin_kaydi.json)
            echo "boş yayın saati: $n"
            if [ "$n" = "0" ]; then echo "atla=1" >> "$GITHUB_OUTPUT"; fi
          fi

  sec:
    needs: kontrol
    if: needs.kontrol.outputs.atla != '1'
    runs-on: ubuntu-latest
    outputs:
      bolum: ${{ steps.s.outputs.bolum }}
      slot: ${{ steps.s.outputs.slot }}
      hat: ${{ steps.s.outputs.hat }}
      ad: ${{ steps.s.outputs.ad }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - id: s
        env:
          PROFIL: ${{ inputs.profil || 'shorts' }}
          BOLUM: ${{ inputs.bolum }}
          HAT: ${{ inputs.hat }}
          YAYIN: ${{ inputs.yayin == 'hayir' && 'kapali' || vars.YAYIN || 'kapali' }}
          EN_COK_SLOT: "1"
        run: |
          python bulut3d.py sec
          b=$(grep '^bolum=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          [ -n "$b" ] && echo "ad=$(basename "$b" .json)-${{ github.run_id }}" >> "$GITHUB_OUTPUT" || true

  # 2026-11-12: 24 fps + 1080p (kullanıcı: "daha canlı, daha çok izlenme"); 8 makinede parçalı çizim
  ciz:
    needs: sec
    if: needs.sec.outputs.bolum != ''
    uses: ./.github/workflows/ciz.yml
    with:
      bolum: ${{ needs.sec.outputs.bolum }}
      profil: ${{ inputs.profil || 'shorts' }}
      ad: ${{ needs.sec.outputs.ad }}
      prototip: ${{ inputs.profil == 'uzun' }}

  yukle:
    needs: [sec, ciz]
    if: always() && needs.sec.outputs.bolum != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: video-${{ needs.sec.outputs.ad }}
          path: hazir
      - name: Videoyu yerine koy
        run: |
          [ -d hazir/cikti3d ] && cp -r hazir/cikti3d . || echo "video yok (çizim başarısız)"
          [ -f hazir/karakter_izleri.json ] && cp hazir/karakter_izleri.json seri/findik-ile-pamuk/ || true
      - name: Denetle, (izinliyse) yükle
        env:
          PROFIL: ${{ inputs.profil || 'shorts' }}
          YAYIN: ${{ inputs.yayin == 'hayir' && 'kapali' || vars.YAYIN || 'kapali' }}
          YT_GIZLILIK: ${{ vars.YT_GIZLILIK || 'private' }}
          YT_HERKESE_ACIK_ONAY: ${{ vars.YT_HERKESE_ACIK_ONAY || 'hayir' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bulut3d.py yukle "${{ needs.sec.outputs.bolum }}" "${{ needs.sec.outputs.slot }}"
      - name: Yayın kaydını depoya yaz
        if: always()
        run: |
          git config user.name "cocuk-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          cp yayin_kaydi.json "$RUNNER_TEMP/kayit.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/kayit.json"
          cp seri/findik-ile-pamuk/karakter_izleri.json "$RUNNER_TEMP/izler.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python kayit_birlestir.py "$RUNNER_TEMP/kayit.json" "$RUNNER_TEMP/izler.json"
            git add yayin_kaydi.json seri/findik-ile-pamuk/karakter_izleri.json
            git diff --cached --quiet && exit 0
            git commit -q -m "yayın kaydı: $(date -u +%F)" && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
