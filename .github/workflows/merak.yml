name: Merak Arşivi yayın

# Takvim (otonom/takvim.py): salı+cuma 18:00 uzun belgesel, pzt/çar/per/cmt 19:00 Shorts (TR).
# Her gün çalışır, önümüzdeki 7 günün boş saatlerini zamanlanmış yüklemeyle doldurur (haftalık onay penceresi).
# Kanal anahtarı MERAK_YT_REFRESH_TOKEN; yayın anahtarı MERAK_YAYIN (acik olmadıkça yalnız üretir).
on:
  schedule:
    - cron: "47 3,9,15,21 * * *"   # 6 saatte bir; boş saat yoksa hemen biter
  workflow_dispatch:
    inputs:
      profil:
        description: "Elle tek video için: shorts / uzun (boş = takvimi doldur)"
        required: false
      konu:
        description: "Belirli konu kimliği (boş = sıradaki), ör. derinkuyu-underground-city"
        required: false
      senaryo:
        description: "Belirli senaryo (uzun, kisa1...)"
        required: false
      yayin:
        description: "otomatik = depo ayarına uy; hayir = yalnız üret ve denetle (deneme)"
        default: "otomatik"

permissions:
  contents: write

concurrency:
  group: merak
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        run: |
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          if [ "${{ vars.MERAK_YAYIN }}" != "acik" ]; then
            echo "Merak yayını kapalı: zamanlanmış çalıştırma atlandı"; echo "atla=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(( $(python3 -m otonom.takvim merak_uzun merak/kayit.json) + $(python3 -m otonom.takvim merak_shorts merak/kayit.json) ))
          echo "boş yayın saati: $n"
          if [ "$n" = "0" ]; then echo "atla=1" >> "$GITHUB_OUTPUT"; fi

  yayin:
    needs: kontrol
    if: needs.kontrol.outputs.atla != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - name: Üret, denetle, (izinliyse) yükle
        env:
          YAYIN: ${{ inputs.yayin == 'hayir' && 'kapali' || vars.MERAK_YAYIN || 'kapali' }}
          MERAK_GIZLILIK: ${{ vars.MERAK_GIZLILIK || 'private' }}
          YT_HERKESE_ACIK_ONAY: ${{ vars.YT_HERKESE_ACIK_ONAY || 'hayir' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.MERAK_YT_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ inputs.konu }}" ]; then
            python -m merak.yayinla --profil "${{ inputs.profil || 'uzun' }}" --konu "${{ inputs.konu }}" \
              --senaryo "${{ inputs.senaryo || 'uzun' }}" --yayin "${{ inputs.yayin || 'otomatik' }}"
          elif [ -n "${{ inputs.profil }}" ]; then
            python -m merak.yayinla --profil "${{ inputs.profil }}" --yayin "${{ inputs.yayin || 'otomatik' }}"
          else
            python -m merak.yayinla --yayin "${{ inputs.yayin || 'otomatik' }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merak-${{ github.run_id }}
          path: |
            merak/cikti/*.mp4
            merak/cikti/*.jpg
            merak/cikti/*.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Kaydı depoya yaz
        if: always()
        run: |
          git config user.name "cocuk-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          cp merak/kayit.json "$RUNNER_TEMP/kayit.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/kayit.json"
          mkdir -p "$RUNNER_TEMP/kaynaklar"
          for f in merak/konular/*/KAYNAKLAR.md; do [ -f "$f" ] && mkdir -p "$RUNNER_TEMP/kaynaklar/$(dirname $f)" && cp "$f" "$RUNNER_TEMP/kaynaklar/$f"; done
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m ortak.kayit merak/kayit.json "$RUNNER_TEMP/kayit.json"
            cp -r "$RUNNER_TEMP/kaynaklar/merak" . 2>/dev/null || true
            git add merak/kayit.json merak/konular
            git diff --cached --quiet && exit 0
            git commit -q -m "merak kayıt: $(date -u +%F)" && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
