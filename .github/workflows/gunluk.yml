name: Günlük çocuk Shorts

on:
  # Zamanlama kurulum (YouTube izni + API onayı) bitince açılacak; o zamana kadar yalnız elle.
  # schedule:
  #   - cron: "30 5 * * *"   # 08:30 TR
  #   - cron: "30 14 * * *"  # 17:30 TR
  workflow_dispatch:
    inputs:
      tur:
        description: "Tür (boş = otomatik): masal / egitici / hayvan"
        required: false

permissions:
  contents: write

concurrency:
  group: uretim
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install -r requirements.txt
      - name: Testler (geçmezse üretim yapılmaz)
        run: python -m unittest discover -s tests
      - name: Üret, denetle, (izinliyse) yükle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # YouTube API denetimi onaylanınca Settings > Variables'ta YAYIN=acik yapılır
          YAYIN: ${{ vars.YAYIN || 'kapali' }}
          YT_GIZLILIK: ${{ vars.YT_GIZLILIK || 'private' }}
          YT_HERKESE_ACIK_ONAY: ${{ vars.YT_HERKESE_ACIK_ONAY || 'hayir' }}
          TUR: ${{ inputs.tur }}
        run: python calistir.py
      - name: Yayımlanmayan videoyu 3 gün indirilebilir bırak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: cikti/*.mp4
          retention-days: 3
          if-no-files-found: ignore
      - name: Çalışma kaydı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kayit-${{ github.run_id }}
          path: kayit/
          retention-days: 14
          if-no-files-found: ignore
      - name: Geçmişi kaydet
        if: always()
        run: |
          git config user.name "cocuk-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gecmis.json
          git diff --cached --quiet && exit 0
          git commit -m "geçmiş: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
